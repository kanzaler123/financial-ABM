name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    env:
      QT_QPA_PLATFORM: offscreen
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0
      - name: Install locked dependencies and package
        run: python -m pip install -c requirements-lock.txt -e '.[all,dev]'
      - name: Run static lint (ruff)
        run: python -m pip install ruff && ruff check src tests paper scripts showcase
      - name: Run test suite
        run: python -m pytest --junitxml=test-results.xml
      - name: Verify paper figures and descriptive statistics reproduction
        run: python paper/make_figures.py && python paper/composition.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.python }}
          path: test-results.xml
          if-no-files-found: ignore
          retention-days: 7

  core-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install the package without optional extras
        run: python -m pip install -c requirements-lock.txt .
      - name: Run a short simulation with core dependencies only
        run: |
          python - <<'EOF'
          import importlib.util
          from dataclasses import replace
          from abm import load_stage1_config, run_stage1
          from abm.disclosure import MarketConfig
          from abm.disclosure.domain import load_domain
          from abm.disclosure.game import run_disclosure
          from abm.disclosure.policy import PolicySchedule
          for heavy in ("matplotlib", "fastapi", "PySide6", "vispy", "scipy"):
              assert importlib.util.find_spec(heavy) is None, heavy
          config = replace(load_stage1_config("configs/stage1.json"), population_size=500, trading_days=200, burn_in_days=50)
          result = run_stage1(config)
          assert result.prices.size == 201
          dom = load_domain("configs/domains/esg.json")
          dcfg = MarketConfig(n_investors=40, n_firms=12, trading_days=120, burn_in_days=60, seed=7)
          dres = run_disclosure(dcfg, dom, PolicySchedule.constant(dom))
          assert dres.true_goodness.shape == (121, 12)
          print("core-only run ok", result.fingerprint()[:16], dres.fingerprint()[:16])
          EOF

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npm audit --audit-level=high
