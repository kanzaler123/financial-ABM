name: Audit runtime
on:
  push:
    paths:
      - '.github/workflows/audit-runtime.yml'
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip download --only-binary=:all: --no-deps 'duckdb>=1.4,<2' --dest wheels
      - uses: actions/upload-artifact@v4
        with:
          name: audit-runtime
          path: wheels/*.whl
          retention-days: 1
