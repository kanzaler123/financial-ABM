[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "auditable-market-abm"
version = "0.3.0"
description = "A deterministic, auditable artificial financial market harness."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "kanzaler" }]
keywords = [
  "agent-based-model",
  "market-microstructure",
  "computational-finance",
  "simulation",
]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering",
  "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
  "duckdb>=1.4,<2",
  "numpy>=2.0,<3",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.10,<4"]
web = ["fastapi>=0.116,<1", "uvicorn>=0.35,<1"]
desktop = ["PySide6>=6.8,<7", "pyqtgraph>=0.14,<1", "vispy>=0.15,<1"]
research = ["scipy>=1.14,<2"]
all = ["auditable-market-abm[plot,web,desktop,research]"]
dev = ["httpx>=0.28,<1", "pytest>=8.3,<9"]

[project.scripts]
abm-benchmark = "abm.french49:main"
abm-calibrate = "abm.calibration:main"
abm-calibrate-msm = "abm.msm:main"
abm-baselines = "abm.baselines:main"
abm-msm-report = "abm.msm_report:main"
abm-disclosure-run = "abm.disclosure.runner:main"
abm-disclosure-experiment = "abm.disclosure.experiments:main"
abm-desktop = "abm.desktop:main"
abm-plot = "abm.visualization:main"
abm-web = "abm.web:main"
abm-run = "abm.runner:main"
abm-freeze-stage1 = "abm.stage1_freeze:main"
abm-validate-stage1 = "abm.mechanism_validation:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
